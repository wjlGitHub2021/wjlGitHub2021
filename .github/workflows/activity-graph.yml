name: Update Activity Graph

on:
  schedule:
    # 每天两次（整点）；原先 "* */12" 会每分钟空跑
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Generate activity graph
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: ${{ github.repository_owner }}
          options: area=false&theme=dracula&custom_title=JLong
          output_path: dist/activity-graph.svg
          # 默认 GITHUB_TOKEN 看不全私有仓贡献；用 PAT（repo 权限）与主页图对齐
          token: ${{ secrets.PROFILE_GRAPH_TOKEN }}

      - name: Push activity-graph.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: activity-graph-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
