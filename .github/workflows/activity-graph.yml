name: Update Activity Graph

on:
  schedule:
    # GitHub 最短可靠间隔约 5–15 分钟，实际可能再延迟
    - cron: "*/15 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [refresh-profile-graphs]
  push:
    branches:
      - main

concurrency:
  group: profile-activity-graph
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Generate activity graph
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: ${{ github.repository_owner }}
          options: area=false&theme=dracula&custom_title=JLong
          output_path: dist/activity-graph.svg
          # 默认 GITHUB_TOKEN 看不全私有仓贡献；用 PAT（repo 权限）与主页图对齐
          token: ${{ secrets.PROFILE_GRAPH_TOKEN }}

      - name: Push activity-graph.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: activity-graph-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
